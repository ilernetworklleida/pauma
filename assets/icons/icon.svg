<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="0.6" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- letra P, trazo limpio -->
  <g filter="url(#glow)">
    <path d="M168 132 L168 380" stroke="url(#fg)" stroke-width="40" stroke-linecap="round" fill="none"/>
    <path d="M168 132 L260 132 Q332 132 332 204 Q332 276 260 276 L168 276"
          stroke="url(#fg)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- ondas de sonido -->
  <g stroke="url(#fg)" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M378 196 Q400 256 378 316"/>
    <path d="M412 162 Q450 256 412 350"/>
  </g>
</svg>
